    scan-delay-ms: 10000
    batch-size: 20
    min-interval-seconds: 60

elasticsearch:
  host: 47.93.153.14
  port: 9200
  scheme: http
  index: knowledge

flow-limit:
  enable: true
  time-window: 3
  max-access-count: 20

stream:
  enabled: true
  key: rag:document:ingestion
  group: document-ingestion-group
  consumer: document-ingestion-consumer
  batch-size: 5
  block-ms: 1000
  poll-interval-ms: 500
  max-retries: 1

ai:
  prompt:
    ref-start: "<<参考资料开始>>"
    ref-end: "<<参考资料结束>>"
    no-result-text: "（当前未检索到相关资料）"
  generation:
    temperature: 0.3
    max-token: 2000
    top-p: 0.9

rag:
  embedding:
    batch-size: 10
    concurrency: 4
    max-retries: 2
    retry-backoff-ms: 400
  query-preprocess:
    enabled: true
    max-sub-questions: 6
  fusion:
    enabled: true
    rrf-k: 60
  rerank:
    enabled: true
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      api-key:
      model: gte-rerank
      timeout-seconds: 15
  crag:
    enabled: true
    use-llm: true
    min-score: 0.3
    review-top-k: 5
    fallback-multiplier: 3
    ambiguity-words:
      - 这个
      - 那个
      - 之前
      - 上面
      - 怎么弄
      - 怎么办
    ambiguity-min-length: 6
  memory:
    history-keep-turns: 4
    summary-enabled: true
    summary-start-turns: 8
    summary-max-chars: 320
    summary-max-tokens: 180
    min-delta-messages: 4
    default-max-history: 60
  retrieval:
    default-top-k: 8
    max-top-k: 12
    min-acceptable-score: 0.22
  prompt:
    max-reference-length: 1000
    max-source-reference-count: 8
    temperature-kb: 0.0
    temperature-tool: 0.3
  search:
    channels:
      intent-directed:
        enabled: true
        min-intent-score: 0.55
        top-k-multiplier: 3
      sparse-text:
        enabled: true
        top-k-multiplier: 3
      vector-global:
        enabled: true
        supplement-high-confidence-intent: false
        supplement-score-threshold: 0.3
        single-intent-supplement-threshold: 0.8
        confidence-threshold: 0.65
        top-k-multiplier: 3
        default-confidence: 0.7
    post-processor:
      deduplicate: true
      rrf-fusion: true
      rerank: true
  intent-guidance:
    enabled: true
    hit-threshold: 0.58
    ambiguity-ratio: 0.88
    max-candidates: 4
    max-options: 3
    llm-min-score: 0.45
  intent-resolution:
    per-query-max-candidates: 4
    max-total-candidates: 8
    min-score: 0.45
  trace:
    enabled: true
    max-error-length: 800

